spec_version: v1
kind: external
name: annualized_return_agent
title: Annualized Return Agent
nickname: annualized_return_agent
provider: external_chat/A2A/0.3.0

description: |
  A LangGraph-based AI agent that calculates the annualized rate of return for
  investments. Provide an initial investment amount, current value, and the
  number of months invested to get back the annualized return %, total return %,
  and profit/loss in dollars.

tags:
  - finance
  - investment
  - returns
  - langgraph

# URL pública gerada pelo Cloudflare Quick Tunnel — muda a cada restart de start-local.sh.
# Copie a URL impressa no terminal e cole aqui antes de executar:
#   orchestrate agents import -f agent.yaml
api_url: "https://observation-reduction-looksmart-deluxe.trycloudflare.com"

# Authentication for the A2A endpoint (matches AGENT_API_KEY env var)
auth_scheme: BEARER_TOKEN
auth_config:
  token: "4246d8105f27b54aae64974d685651db92dd0499a9766177ac53bc00e3e30d3c"

chat_params:
  # Send full conversation history to the agent on each turn
  sendHistory: true
  # Use standard blocking REST call (set to true for SSE streaming)
  stream: false
  # Push notifications not supported in this deployment
  pushNotifications: false

config:
  hidden: false
  enable_cot: true

# Allow wxO context variables to be forwarded to the agent
context_access_enabled: true
context_variables:
  - clientID
